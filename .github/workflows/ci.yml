name: DSIQ Native - headless quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q dsiq_native source/extensions/dsiq.studio/dsiq tests
      - run: python -m unittest discover -s tests -v

  contracts-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q dsiq_native source/extensions/dsiq.studio/dsiq tests
      - run: python -m unittest discover -s tests -v

  openusd-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[cad]"
      - run: python -c "from pxr import Usd, UsdGeom, UsdPhysics; print('Pixar USD available')"
      - run: python -m unittest discover -s tests -v
      - name: Generate actual reference scenes and user machine
        run: |
          mkdir -p build/reference-scenes
          python -m dsiq_native environment-render robotics_cell --png build/reference-scenes/robotics.png
          python -m dsiq_native environment-render cleanroom_bay --png build/reference-scenes/cleanroom.png
          python -m dsiq_native environment-render logistics_bay --png build/reference-scenes/logistics.png
          python -m dsiq_native environment-usd robotics_cell build/reference-scenes/robotics.usda
          python -m dsiq_native usd-validate build/reference-scenes/robotics.usda > build/reference-scenes/usd-engineering-audit.json
          python -m unittest discover -s tests -p test_usd_dependency_audit.py -v
          python -m dsiq_native usd-dependency-audit build/reference-scenes/robotics.usda --asset-root build/reference-scenes > build/reference-scenes/usd-dependency-audit.json
          python -c 'import json; a=json.load(open("build/reference-scenes/usd-dependency-audit.json")); assert a["passed"] and a["dependency_file_count"]>=1 and len(a["verified_files"])==a["dependency_file_count"]'

          python -c 'import json; a=json.load(open("build/reference-scenes/usd-engineering-audit.json")); assert a["passed"] and a["stage_sha256_before"]==a["stage_sha256_after"] and a["counts"]["prims"]>0'
          python -m dsiq_native environment-usd cleanroom_bay build/reference-scenes/cleanroom.usda
          python -m dsiq_native environment-usd logistics_bay build/reference-scenes/logistics.usda
          python -m dsiq_native machine-create build/reference-scenes/user-gantry --name review_gantry
          python -m dsiq_native machine-verify build/reference-scenes/user-gantry
          python -m dsiq_native bullet-usd-record build/reference-scenes/measured-motion.usda --frames 4 --steps-per-frame 12 --urdf-manifest build/reference-scenes/user-gantry/machine.manifest.json --joint actuator_x --target 0.25
          python -m dsiq_native usd-telemetry-inspect build/reference-scenes/measured-motion.usda
          python -m dsiq_native usd-urdf-visual-record build/reference-scenes/user-gantry/machine.manifest.json build/reference-scenes/source-geometry-animation.usda --frames 4 --steps-per-frame 12 --joint actuator_x --target 0.25
          python -m dsiq_native cad-usd-record build/reference-scenes/user-gantry/machine.manifest.json build/reference-scenes/source-cad-meshes.usda --frames 4 --steps-per-frame 12 --joint actuator_x --target 0.25
          python -m dsiq_native robot-policy-train build/reference-scenes/reference-policy.json --episodes 16 --horizon 10 --seed 1007
          python -m dsiq_native core-readiness > build/reference-scenes/core-readiness.json
          python -m dsiq_native workcell-new build/reference-scenes/reference.workcell.json --id review_robotics_cell --name "Unqualified CI reference cell" --manifest build/reference-scenes/user-gantry/machine.manifest.json
          python -m dsiq_native workcell-inspect build/reference-scenes/reference.workcell.json
          python -m dsiq_native workcell-audit build/reference-scenes/reference.workcell.json --steps 24
          python -m dsiq_native workcell-catalog-build build/reference-scenes/catalog.json build/reference-scenes/reference.workcell.json
          python -m dsiq_native workcell-catalog build/reference-scenes/catalog.json --simulate --steps 24
          python -m dsiq_native usd-workspace-new build/reference-scenes/layered-project
          python -m dsiq_native usd-workspace-inspect build/reference-scenes/layered-project
          python -m dsiq_native dataset-generate build/reference-scenes/synthetic --frames 2 --seed 1007 --width 64 --height 48 --boxes 2 --steps 24
          python -m dsiq_native dataset-verify build/reference-scenes/synthetic
          python -m dsiq_native dataset-coco build/reference-scenes/synthetic build/reference-scenes/synthetic_coco.json --seed 1007
          python -m dsiq_native render-benchmark --frames 2 --width 64 --height 48 > build/reference-scenes/renderer-benchmark.json
          python -m dsiq_native ros2-preview --lidar-rays 12 > build/reference-scenes/ros2-preview-tf.json
      - name: Upload actual preview renders and OpenUSD reference scenes
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-reference-scenes
          path: build/reference-scenes/
          retention-days: 7

  bullet-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[physics]"
      - run: python -m unittest discover -s tests -v
      - run: python -m dsiq_native bullet-run --steps 240 --boxes 2
      - run: python -m dsiq_native imu-sample --steps 24 --link 5
      - run: python -m dsiq_native physics-backend-check
      - run: python -m dsiq_native physics-extended
      - run: python -m dsiq_native physics-conservation
      - run: python -m dsiq_native machine-create build/runtime-gantry --name ci_runtime_gantry
      - run: python -m dsiq_native robot-urdf-motion build/runtime-gantry/machine.manifest.json --target actuator_x=0.25 --target actuator_y=0.10
      - run: python -m dsiq_native ros2-preview --steps-per-frame 12 --lidar-rays 24
      - run: python -m dsiq_native domain-randomization --envs 2 --iterations 4 --seed 1007

  bullet-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[physics]"
      - run: python -m unittest discover -s tests -v
      - run: python -m dsiq_native bullet-run --steps 240 --boxes 2
      - run: python -m dsiq_native imu-sample --steps 24 --link 5
      - run: python -m dsiq_native physics-backend-check
      - run: python -m dsiq_native physics-extended
      - run: python -m dsiq_native physics-conservation
      - run: python -m dsiq_native machine-create build/runtime-gantry --name ci_runtime_gantry
      - run: python -m dsiq_native robot-urdf-motion build/runtime-gantry/machine.manifest.json --target actuator_x=0.25 --target actuator_y=0.10
      - run: python -m dsiq_native ros2-preview --steps-per-frame 12 --lidar-rays 24

  mujoco-conformance-ubuntu:
    name: Actual MuJoCo CPU / Bullet two-solver source-bound conformance
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real MuJoCo and Bullet native solver bindings
        run: |
          python -m pip install -e ".[mujoco]"
          python -c "import mujoco,pybullet; print('Both genuine solvers import')"
      - name: Test actual isolated source-verified MuJoCo world
        run: python -m unittest discover -s tests -p test_mujoco_backend.py -v
      - name: Test structural physics backend contract with both solvers present
        run: python -m unittest discover -s tests -p test_physics_backend.py -v
      - name: Test actual two-solver step-by-step motor feedback
        run: python -m unittest discover -s tests -p test_solver_motion_trace.py -v
      - name: Run actual MuJoCo source-verified conformance JSON
        run: |
          mkdir -p build/physics-comparison
          python -m dsiq_native physics-backend-check --backend mujoco_cpu_direct_v1 > build/physics-comparison/mujoco-conformance.json
          python -m dsiq_native physics-cross-backend-check --tolerance 0.01 > build/physics-comparison/actual-bullet-mujoco-comparison.json
          python -m dsiq_native physics-motion-trace --steps 100 --sample-every 5 --tolerance .01 --require-match > build/physics-comparison/full-motor-position-velocity-trace.json
          python -c 'import json; r=json.load(open("build/physics-comparison/full-motor-position-velocity-trace.json")); assert len(r["backend_measurements"])==2 and r["steps"]==100 and r["trajectory_comparison"]["position_peak_difference_m"]<=.01 and r["trajectory_comparison"]["within_final_tolerance"] and r["all_source_speed_and_effort_envelopes_satisfied"]'
          python -c 'import json; r=json.load(open("build/physics-comparison/actual-bullet-mujoco-comparison.json")); assert r["passed"] and len(r["individual_backend_conformance"])==2 and not r["same_oem_calibration_or_solver_equivalence_proven"]'
      - name: Archive independently inspectable two-solver residual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-two-real-physics-solvers
          path: build/physics-comparison/
          retention-days: 7

  desktop-linux-xvfb:
    name: Actual Tk desktop smoke test (virtual display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
      - name: Install Bullet physics and desktop dependencies
        run: python -m pip install -e ".[physics]"
      - name: Run real Tk window and Bullet renderer inside Xvfb
        run: xvfb-run -a python -m unittest discover -s tests -p test_desktop_ui.py -v

  windows-portable-preview:
    name: Windows standalone CPU robotics executable (unsigned preview)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen-app build dependencies
        run: |
          python -m pip install -e ".[physics]"
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Freeze CPU CLI with native Bullet bindings
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --console --name DSIQ-Native --collect-all dsiq_native --hidden-import pybullet --hidden-import numpy scripts/dsiq_native_entry.py
      - name: Smoke-test actual Windows executable without system Python invocation
        shell: pwsh
        run: |
          $exe = "dist\DSIQ-Native\DSIQ-Native.exe"
          if (-not (Test-Path $exe)) { throw "Missing frozen DSIQ Native executable" }
          $help = & $exe --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "robot-fk") { throw "Frozen CLI --help failed" }
          $fk = & $exe robot-fk 0 0 0 0 0 0 | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $fk.model -ne "dsiq_reference_6r_v1") { throw "Frozen robotics kinematics failed" }
          $sim = & $exe bullet-run --steps 24 --boxes 0 | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $sim.step_index -ne 24) { throw "Frozen real Bullet simulation failed" }
      - name: Create verified unsigned Windows portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\windows | Out-Null
          Compress-Archive -Path "dist\DSIQ-Native\*" -DestinationPath "build\windows\DSIQ-Native-CPU-Preview-Windows.zip" -Force
          $sha = (Get-FileHash "build\windows\DSIQ-Native-CPU-Preview-Windows.zip" -Algorithm SHA256).Hash
          "$sha  DSIQ-Native-CPU-Preview-Windows.zip" | Out-File -FilePath "build\windows\SHA256SUMS.txt" -Encoding ascii
          python -m dsiq_native release-attest "build\windows\DSIQ-Native-CPU-Preview-Windows.zip" "build\windows\release.attestation.json"
          python -m dsiq_native release-verify "build\windows\DSIQ-Native-CPU-Preview-Windows.zip" "build\windows\release.attestation.json"
          python -m dsiq_native release-sbom "build\windows\installed-components.spdx.json"
      - name: Upload independently smoke-tested executable preview
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-native-windows-cpu-unsigned
          path: build/windows/
          retention-days: 7

  ros2-jazzy-live-dds:
    name: ROS 2 Jazzy live DDS transport from real Bullet capture
    needs: openusd-integration
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsiq-reference-scenes
          path: build/reference-scenes
      - name: Install ROS message packages and validate live DDS pub/sub
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-venv ros-jazzy-tf2-msgs ros-jazzy-sensor-msgs ros-jazzy-rosgraph-msgs ros-jazzy-geometry-msgs
          # ROS 2 setup scripts may reference unset shell variables by design.
          source /opt/ros/jazzy/setup.bash
          set -u
          /usr/bin/python3 scripts/ros2_middleware_acceptance.py build/reference-scenes/ros2-preview-tf.json
          # Run ACTUAL DSIQ ros2-stream executable with isolated Bullet client,
          # not only synthetic message replay. Keep ROS distro packages visible.
          /usr/bin/python3 -m venv --system-site-packages /tmp/dsiq-ros-env
          /tmp/dsiq-ros-env/bin/python -m pip install -e .
          # The default 3.2.7 PyPI Linux distribution lacks CPython 3.12
          # wheels and would compile Bullet C++ from source inside ROS Jazzy.
          # Use the tested prebuilt x86_64 CPython 3.12-compatible fork.
          /tmp/dsiq-ros-env/bin/python -m pip install "numpy>=1.26,<2" "pybullet-arm64==3.2.8" --only-binary=:all:
          /tmp/dsiq-ros-env/bin/python -c "import pybullet; print('ROS Jazzy Bullet ABI loaded')"
          /tmp/dsiq-ros-env/bin/python scripts/ros2_native_publisher_acceptance.py

  opengl-source-cad-studio:
    name: Real native OpenGL workcell GPU pipeline (Mesa CI software GL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenGL context and display driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1 libgl1-mesa-dri mesa-utils
      - name: Install actual Panda3D GPU raster renderer, source CAD and Bullet
        run: python -m pip install -e ".[gpu]"
      - name: Verify GL pipeline and native editor transform operations
        run: DSIQ_GPU_CI=1 xvfb-run -a -s "-screen 0 1280x720x24" python -m unittest discover -s tests -p test_gpu_opengl_studio.py -v
      - name: Smoke-test the real interactive native editor window and controls
        run: xvfb-run -a -s "-screen 0 1280x720x24" python scripts/gpu_native_ui_smoke.py
      - name: Benchmark actual OpenGL rendering and record screenshot
        run: |
          mkdir -p build/gpu
          xvfb-run -a -s "-screen 0 1280x720x24" python -m dsiq_native gpu-benchmark --frames 48 --width 640 --height 480 --screenshot build/gpu/opengl-scene.png > build/gpu/opengl-report.json
          python -c 'import json; d=json.load(open("build/gpu/opengl-report.json")); assert d["triangles_in_gpu_scene"]>200 and d["observed_fps"]>0; assert not d["nvidia_rtx_hardware_qualified"]'
      - name: Upload real framebuffer capture + measured timings
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-native-opengl-software-ci
          path: build/gpu/
          retention-days: 7

  windows-native-gpu-preview:
    name: Windows native OpenGL CAD studio executable (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real OpenGL, source CAD and Windows freezing dependencies
        run: |
          python -m pip install -e ".[gpu]"
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Package the OpenGL editor into independent Windows executable
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --console --name DSIQ-Native-GPU --collect-all panda3d --collect-all direct --collect-all trimesh --collect-all pxr --collect-all dsiq_native --hidden-import pybullet --hidden-import numpy --hidden-import direct.showbase.ShowBase --hidden-import direct.gui.DirectGui scripts/dsiq_native_entry.py
      - name: Verify generated Windows executable start and engineering CLI
        shell: pwsh
        run: |
          $exe = "dist\DSIQ-Native-GPU\DSIQ-Native-GPU.exe"
          if (-not (Test-Path $exe)) { throw "Frozen native GPU Studio executable missing" }
          $help = & $exe --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "gpu-studio" -or $help -notmatch "cad-usd-record") { throw "GPU editor command registration failed" }
          $source = & $exe machine-create build\gpu-fixture --name gpu_release_test | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $source.machine_type -ne "mechanically_actuated_xyz_gantry") { throw "GPU executable reference machine builder failed" }
          $mesh = & $exe cad-mesh-lock build\gpu-fixture\machine.manifest.json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $mesh.count -ne 0) { throw "GPU executable rights-check import failed" }
      - name: Build archive with SHA256 and installed-component SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\windows-gpu | Out-Null
          Compress-Archive -Path "dist\DSIQ-Native-GPU\*" -DestinationPath "build\windows-gpu\DSIQ-Native-GPU-Preview.zip" -Force
          python -m dsiq_native release-attest "build\windows-gpu\DSIQ-Native-GPU-Preview.zip" "build\windows-gpu\release.attestation.json"
          python -m dsiq_native release-verify "build\windows-gpu\DSIQ-Native-GPU-Preview.zip" "build\windows-gpu\release.attestation.json"
          python -m dsiq_native release-sbom "build\windows-gpu\installed-components.spdx.json"
          $hash = (Get-FileHash "build\windows-gpu\DSIQ-Native-GPU-Preview.zip" -Algorithm SHA256).Hash
          "$hash  DSIQ-Native-GPU-Preview.zip" | Out-File "build\windows-gpu\SHA256SUMS.txt" -Encoding ascii
      - name: Ensure unsigned GPU preview cannot pass production gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/windows_production_gate.ps1 -Executable "dist\DSIQ-Native-GPU\DSIQ-Native-GPU.exe" -ExpectedSignerThumbprint "" | Out-File build\windows-gpu\release-blockers.json
          if ($LASTEXITCODE -eq 0) { throw "Unsigned GPU preview incorrectly qualified as production release" }
          # GitHub pwsh runner propagates the last native-process exit code.
          # An expected policy refusal is a PASS for this negative test.
          $global:LASTEXITCODE = 0
          Write-Host "Unsigned preview correctly blocked from production"
      - name: Upload portable Windows native GPU editor preview
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-native-windows-opengl-unsigned
          path: build/windows-gpu/
          retention-days: 7

  security-release-and-software-safety:
    name: Signed update validation, safety contracts and dependency security evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install patched build tooling, Ed25519 verifier and dependency auditor
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0,<90"
          python -m pip install -e ".[security]"
          python -m pip install "pip-audit>=2.7,<3"
      - name: Verify real signature, tamper, downgrade, missing evidence and motion limits
        run: |
          python -m unittest discover -s tests -p test_secure_update.py -v
          python -m unittest discover -s tests -p test_launch_evidence.py -v
          python -m unittest discover -s tests -p test_motion_safety.py -v
      - name: Record dependency vulnerabilities and FAIL release-security gate on any audit failure
        shell: bash
        run: |
          mkdir -p build/security
          if pip-audit --format json --output build/security/dependency-audit.json; then
            echo "PASS: no vulnerabilities reported in this runner's installed Python environment" > build/security/audit-status.txt
          else
            echo "BLOCKED: vulnerable dependencies or audit service failure; independent remediation and rerun required" > build/security/audit-status.txt
            exit 1
          fi
          test -s build/security/dependency-audit.json
      - name: Publish security evidence even when the audit blocks CI (NOT certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-security-advisory-unreviewed
          path: build/security/
          retention-days: 7
