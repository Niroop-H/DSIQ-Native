name: DSIQ Native - headless quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q dsiq_native source/extensions/dsiq.studio/dsiq tests
      - run: python -m unittest discover -s tests -v

  contracts-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q dsiq_native source/extensions/dsiq.studio/dsiq tests
      - run: python -m unittest discover -s tests -v

  openusd-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[robotics]"
      - run: python -c "from pxr import Usd, UsdGeom, UsdPhysics; print('Pixar USD available')"
      - run: python -m unittest discover -s tests -v
      - name: Generate actual reference scenes and user machine
        run: |
          mkdir -p build/reference-scenes
          python -m dsiq_native environment-render robotics_cell --png build/reference-scenes/robotics.png
          python -m dsiq_native environment-render cleanroom_bay --png build/reference-scenes/cleanroom.png
          python -m dsiq_native environment-render logistics_bay --png build/reference-scenes/logistics.png
          python -m dsiq_native environment-usd robotics_cell build/reference-scenes/robotics.usda
          python -m dsiq_native environment-usd cleanroom_bay build/reference-scenes/cleanroom.usda
          python -m dsiq_native environment-usd logistics_bay build/reference-scenes/logistics.usda
          python -m dsiq_native machine-create build/reference-scenes/user-gantry --name review_gantry
          python -m dsiq_native machine-verify build/reference-scenes/user-gantry
          python -m dsiq_native bullet-usd-record build/reference-scenes/measured-motion.usda --frames 4 --steps-per-frame 12 --urdf-manifest build/reference-scenes/user-gantry/machine.manifest.json --joint actuator_x --target 0.25
          python -m dsiq_native usd-telemetry-inspect build/reference-scenes/measured-motion.usda
          python -m dsiq_native usd-urdf-visual-record build/reference-scenes/user-gantry/machine.manifest.json build/reference-scenes/source-geometry-animation.usda --frames 4 --steps-per-frame 12 --joint actuator_x --target 0.25
          python -m dsiq_native robot-policy-train build/reference-scenes/reference-policy.json --episodes 16 --horizon 10 --seed 1007
          python -m dsiq_native core-readiness > build/reference-scenes/core-readiness.json
          python -m dsiq_native workcell-new build/reference-scenes/reference.workcell.json --id review_robotics_cell --name "Unqualified CI reference cell" --manifest build/reference-scenes/user-gantry/machine.manifest.json
          python -m dsiq_native workcell-inspect build/reference-scenes/reference.workcell.json
          python -m dsiq_native workcell-audit build/reference-scenes/reference.workcell.json --steps 24
          python -m dsiq_native workcell-catalog-build build/reference-scenes/catalog.json build/reference-scenes/reference.workcell.json
          python -m dsiq_native workcell-catalog build/reference-scenes/catalog.json --simulate --steps 24
          python -m dsiq_native usd-workspace-new build/reference-scenes/layered-project
          python -m dsiq_native usd-workspace-inspect build/reference-scenes/layered-project
          python -m dsiq_native dataset-generate build/reference-scenes/synthetic --frames 2 --seed 1007 --width 64 --height 48 --boxes 2 --steps 24
          python -m dsiq_native dataset-verify build/reference-scenes/synthetic
          python -m dsiq_native dataset-coco build/reference-scenes/synthetic build/reference-scenes/synthetic_coco.json --seed 1007
          python -m dsiq_native render-benchmark --frames 2 --width 64 --height 48 > build/reference-scenes/renderer-benchmark.json
          python -m dsiq_native ros2-preview --lidar-rays 12 > build/reference-scenes/ros2-preview-tf.json
      - name: Upload actual preview renders and OpenUSD reference scenes
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-reference-scenes
          path: build/reference-scenes/
          retention-days: 7

  bullet-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[physics]"
      - run: python -m unittest discover -s tests -v
      - run: python -m dsiq_native bullet-run --steps 240 --boxes 2
      - run: python -m dsiq_native physics-extended
      - run: python -m dsiq_native physics-conservation
      - run: python -m dsiq_native machine-create build/runtime-gantry --name ci_runtime_gantry
      - run: python -m dsiq_native robot-urdf-motion build/runtime-gantry/machine.manifest.json --target actuator_x=0.25 --target actuator_y=0.10
      - run: python -m dsiq_native ros2-preview --steps-per-frame 12 --lidar-rays 24

  bullet-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[physics]"
      - run: python -m unittest discover -s tests -v
      - run: python -m dsiq_native bullet-run --steps 240 --boxes 2
      - run: python -m dsiq_native physics-extended
      - run: python -m dsiq_native physics-conservation
      - run: python -m dsiq_native machine-create build/runtime-gantry --name ci_runtime_gantry
      - run: python -m dsiq_native robot-urdf-motion build/runtime-gantry/machine.manifest.json --target actuator_x=0.25 --target actuator_y=0.10
      - run: python -m dsiq_native ros2-preview --steps-per-frame 12 --lidar-rays 24

  desktop-linux-xvfb:
    name: Actual Tk desktop smoke test (virtual display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
      - name: Install Bullet physics and desktop dependencies
        run: python -m pip install -e ".[physics]"
      - name: Run real Tk window and Bullet renderer inside Xvfb
        run: xvfb-run -a python -m unittest discover -s tests -p test_desktop_ui.py -v

  windows-portable-preview:
    name: Windows standalone CPU robotics executable (unsigned preview)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen-app build dependencies
        run: |
          python -m pip install -e ".[physics]"
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Freeze CPU CLI with native Bullet bindings
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --console --name DSIQ-Native --collect-all dsiq_native --hidden-import pybullet --hidden-import numpy scripts/dsiq_native_entry.py
      - name: Smoke-test actual Windows executable without system Python invocation
        shell: pwsh
        run: |
          $exe = "dist\DSIQ-Native\DSIQ-Native.exe"
          if (-not (Test-Path $exe)) { throw "Missing frozen DSIQ Native executable" }
          $help = & $exe --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "robot-fk") { throw "Frozen CLI --help failed" }
          $fk = & $exe robot-fk 0 0 0 0 0 0 | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $fk.model -ne "dsiq_reference_6r_v1") { throw "Frozen robotics kinematics failed" }
          $sim = & $exe bullet-run --steps 24 --boxes 0 | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $sim.step_index -ne 24) { throw "Frozen real Bullet simulation failed" }
      - name: Create verified unsigned Windows portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\windows | Out-Null
          Compress-Archive -Path "dist\DSIQ-Native\*" -DestinationPath "build\windows\DSIQ-Native-CPU-Preview-Windows.zip" -Force
          $sha = (Get-FileHash "build\windows\DSIQ-Native-CPU-Preview-Windows.zip" -Algorithm SHA256).Hash
          "$sha  DSIQ-Native-CPU-Preview-Windows.zip" | Out-File -FilePath "build\windows\SHA256SUMS.txt" -Encoding ascii
          python -m dsiq_native release-attest "build\windows\DSIQ-Native-CPU-Preview-Windows.zip" "build\windows\release.attestation.json"
          python -m dsiq_native release-verify "build\windows\DSIQ-Native-CPU-Preview-Windows.zip" "build\windows\release.attestation.json"
      - name: Upload independently smoke-tested executable preview
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-native-windows-cpu-unsigned
          path: build/windows/
          retention-days: 7

  ros2-jazzy-live-dds:
    name: ROS 2 Jazzy live DDS transport from real Bullet capture
    needs: openusd-integration
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsiq-reference-scenes
          path: build/reference-scenes
      - name: Install ROS message packages and validate live DDS pub/sub
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ros-jazzy-tf2-msgs ros-jazzy-sensor-msgs ros-jazzy-rosgraph-msgs ros-jazzy-geometry-msgs
          source /opt/ros/jazzy/setup.bash
          /usr/bin/python3 scripts/ros2_middleware_acceptance.py build/reference-scenes/ros2-preview-tf.json
