name: DSIQ Native - real desktop UI video evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/record_ui_demo.py"
      - ".github/workflows/ui-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-native-ui:
    name: Exercise real Panda3D editor + Bullet and record actual display
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real software OpenGL display and ffmpeg video capture
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1 libgl1-mesa-dri mesa-utils ffmpeg
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Install real DSIQ native editor, Bullet and source geometry
        run: |
          python -m pip install -e ".[gpu]"
          python -c "import panda3d.core,pybullet;print('Panda3D and Bullet available')"
      - name: Run live Bullet motor and real OpenGL editor acceptance suites
        run: |
          python -m unittest discover -s tests -p test_imported_trajectory.py -v
          DSIQ_GPU_CI=1 xvfb-run -a -s "-screen 0 1280x720x24" python -m unittest discover -s tests -p test_gpu_opengl_studio.py -v
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/gpu_native_ui_smoke.py
      - name: Execute real editor interactions and capture 15-second screen recording
        run: |
          mkdir -p build/ui-demo
          xvfb-run -a -s "-screen 0 1280x720x24" python scripts/record_ui_demo.py
          ffprobe -v error -show_streams -show_format build/ui-demo/dsiq-native-editor-live-test.mp4 > build/ui-demo/ffprobe.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/ui-demo")
          report=json.loads((p/"dsiq-native-ui-test.json").read_text())
          assert report["on_screen_ui_present"]
          assert report["actual_simulated_physics_steps"]>0
          assert report["measured_final_actuator_x_m"]>report["measured_initial_actuator_x_m"]+.005
          assert report["real_transform_move_and_undo_redo_tested"]
          assert report["actual_source_triangles"]>200
          assert (p/"dsiq-native-editor-live-test.mp4").stat().st_size>20000
          assert (p/"dsiq-native-editor-ui.png").stat().st_size>1000
          assert report["gpu_rtx3050_hardware_qualified"] is False
          print("Real GUI, CAD, physics and video evidence checks PASS")
          PY
          ffmpeg -hide_banner -loglevel error -ss 2 -i build/ui-demo/dsiq-native-editor-live-test.mp4 -frames:v 1 -y build/ui-demo/frame-02s.png
          ffmpeg -hide_banner -loglevel error -ss 9 -i build/ui-demo/dsiq-native-editor-live-test.mp4 -frames:v 1 -y build/ui-demo/frame-09s.png
          ffmpeg -hide_banner -loglevel error -ss 13 -i build/ui-demo/dsiq-native-editor-live-test.mp4 -frames:v 1 -y build/ui-demo/frame-13s.png
      - name: Upload independently inspectable real UI MP4, frames and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsiq-native-real-ui-demo-video
          path: build/ui-demo/
          retention-days: 7
