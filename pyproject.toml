[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsiq-native"
version = "0.2.0"
description = "DSIQ Native OpenUSD industrial and robotics engineering foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
usd = ["usd-core>=25.05"]
physics = ["numpy>=1.26,<2", "pybullet==3.2.7; platform_system != 'Windows'", "pybullet-arm64==3.2.8; platform_system == 'Windows'"]
robotics = ["usd-core>=25.05", "numpy>=1.26,<2", "pybullet==3.2.7; platform_system != 'Windows'", "pybullet-arm64==3.2.8; platform_system == 'Windows'"]
dev = ["usd-core>=25.05", "numpy>=1.26,<2", "pybullet==3.2.7; platform_system != 'Windows'", "pybullet-arm64==3.2.8; platform_system == 'Windows'"]
cad = ["usd-core>=25.05", "trimesh>=4.4,<5", "numpy>=1.26,<2", "pybullet==3.2.7; platform_system != 'Windows'", "pybullet-arm64==3.2.8; platform_system == 'Windows'"]
gpu = ["panda3d>=1.10.14,<1.11", "trimesh>=4.4,<5", "usd-core>=25.05", "numpy>=1.26,<2", "pybullet==3.2.7; platform_system != 'Windows'", "pybullet-arm64==3.2.8; platform_system == 'Windows'"]
mujoco = ["mujoco>=3.3,<4", "numpy>=1.26,<2", "pybullet==3.2.7; platform_system != 'Windows'", "pybullet-arm64==3.2.8; platform_system == 'Windows'"]
security = ["cryptography>=50,<51"]


[project.scripts]
dsiq-native = "dsiq_native.cli:main"

[tool.setuptools]
packages = ["dsiq_native"]
